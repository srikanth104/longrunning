[project]
name = "longrunning"
version = "0.1.0"
description = "Long running agent demo"
readme = "README.md"
authors = [
    { name = "Srikanth Vusikarla", email = "srikanth.vusikarla@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
longrunning = "longrunning:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
